[project]
name = "tb-spike-s2"
version = "0.0.0"
description = "S2: asyncio+uvloop MLLP receiver -> Kafka (acks=all, idempotent), ACK after commit; TLS; load and broker-failure tests."
requires-python = ">=3.12"
dependencies = [
    "tb-spike-common",
    "confluent-kafka>=2.6.0",
    "uvloop>=0.20.0; sys_platform != 'win32'",  # MIT; no Windows wheel, server falls back to asyncio.run
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
]

[tool.uv.sources]
tb-spike-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
markers = [
    "integration: needs the spike Kafka cluster (spikes/common/docker-compose.yml)",
    "chaos: injects broker/consumer faults",
    "bench: measurement run, not a pass/fail test",
]
addopts = "-ra"
timeout = 60
