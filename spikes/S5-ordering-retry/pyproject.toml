[project]
name = "tb-spike-s5"
version = "0.0.0"
description = "S5: blocking retry with partition pause/resume, cooperative-sticky + static membership, transactional Kafka-to-Kafka, DLQ."
requires-python = ">=3.12"
dependencies = [
    "tb-spike-common",
    "confluent-kafka>=2.6.0",
    "orjson>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "pytest-timeout>=2.3",
]

[tool.uv.sources]
tb-spike-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s5"]

[tool.pytest.ini_options]
markers = [
    "integration: needs the spike Kafka cluster (spikes/common/docker-compose.yml)",
    "chaos: injects broker/consumer faults",
    "bench: measurement run, not a pass/fail test",
]
addopts = "-ra"
