[project]
name = "tb-spike-s7"
version = "0.0.0"
description = "S7: retry-topic policy - delay mechanism (pause-until-due vs in-memory delay buffer vs topic-per-tier), head-of-line cost, poison to DLQ, duplicates under kill."
requires-python = ">=3.12"
dependencies = [
    "tb-spike-common",
    "confluent-kafka>=2.6.0",  # Apache-2.0
    "orjson>=3.10.0",          # MPL-2.0 AND (Apache-2.0 OR MIT), human-approved, unmodified
]

[dependency-groups]
dev = [
    "pytest>=8.3",             # MIT
    "hypothesis>=6.112",       # MPL-2.0, unmodified test-only dependency
    "pytest-timeout>=2.3",     # MIT
]

[tool.uv.sources]
tb-spike-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s7"]

[tool.pytest.ini_options]
markers = [
    "integration: needs the spike Kafka cluster (spikes/common/docker-compose.yml)",
    "chaos: injects broker/consumer faults",
    "bench: measurement run, not a pass/fail test",
]
addopts = "-ra"
