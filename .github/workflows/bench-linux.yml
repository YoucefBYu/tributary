# Linux re-run of the Phase 0 S1/S2 benchmarks (human decision #7, first Phase 1 CI task).
# S1 (benchmarks/s1_hl7_parse_throughput.py) measures the real tributary-hl7v2 package; S2
# (benchmarks/s2_mllp_ack_latency.py) measures the real tributary.receivers.mllp receiver against a
# private single-node (lite) Kafka container this job starts itself via testcontainers -- see each
# script's module docstring for exactly what is and is not comparable to the Phase 0 numbers (S1: no
# transform step exists yet; S2: lite/RF=1, not the RF=3 topology Phase 0 measured, and closed-loop
# rather than Phase 0's open-loop load generator). Manual trigger only: it never runs on push, and only
# runs once a human pushes the branch.
name: bench-linux

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  s1-s2:
    runs-on: ${{ vars.TB_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - name: record environment
        run: |
          mkdir -p benchmarks/results
          {
            echo "date_utc: $(date -u +%FT%TZ)"
            echo "git_sha: $GITHUB_SHA"
            echo "runner_image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            uname -a
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz' || true
            free -m
            python3 --version
            uv --version
            docker --version
          } | tee benchmarks/results/environment.txt
          uv export --frozen --all-groups --no-emit-workspace --no-hashes > benchmarks/results/locked-versions.txt
      - name: run S1 (HL7 parse throughput)
        run: uv run python -m benchmarks.s1_hl7_parse_throughput --count 10000 --repeats 5 --procs 1,2,4,8
      - name: run S2 (MLLP ACK latency)
        run: uv run python -m benchmarks.s2_mllp_ack_latency --count 5000 --conns 20
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: bench-linux-${{ github.run_id }}
          path: benchmarks/results/
