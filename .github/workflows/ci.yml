name: ci

on:
  pull_request:
  push:
    branches: [main, "wave/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"   # fail if uv.lock is out of date, never re-resolve in CI

jobs:
  contracts:
    # architect-owned, dependency-free by design: jsonschema plus the standard library only, paths
    # resolved relative to the script. Runs with --no-project so it proves contracts/ is valid on a
    # clean clone before uv sync and before the workspace exists at all, ahead of and separate from
    # qa-engineer's pytest conformance suite below.
    name: contract validation (contracts/validate.py)
    runs-on: ${{ vars.TB_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      # Exits non-zero if the default run or any pinned (json_path, validator) pair fails; see ci_local.sh.
      - name: contracts validate and pinned failure pairs
        run: .github/scripts/ci_local.sh --here contracts

  python:
    name: lint, types, unit tests, conformance
    runs-on: ${{ vars.TB_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: lint, types, fast tests, contract conformance, sync-reply property tests
        run: .github/scripts/ci_local.sh --here python

  integration:
    name: integration (testcontainers)
    runs-on: ${{ vars.TB_RUNNER || 'ubuntu-24.04' }}
    needs: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Collection check, the run, and the passed-equals-expected, none-skipped count check; see ci_local.sh.
      - name: integration tests
        run: .github/scripts/ci_local.sh --here integration

  supply-chain:
    name: licence and SBOM, secret scan, gitignore guard
    runs-on: ${{ vars.TB_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - name: gitignore guard, secret scan, licence check and SBOM
        run: .github/scripts/ci_local.sh --here supply-chain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json

  image-check:
    # ADR-007 follow-up 18 / D24, W3-13: builds each package image from the repo Dockerfile and runs
    # .github/scripts/image_env_check.py inside it (no duplicate distribution names, tributary.context and
    # tributary.* step entry points match the registries), plus a negative control per image. No image is
    # published until this is green.
    name: image environment check (duplicates, entry-point registries)
    runs-on: ${{ vars.TB_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: image environment check
        run: .github/scripts/ci_local.sh --here image-check

  ui:
    name: ui lint, typecheck, test
    runs-on: ${{ vars.TB_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: skip until ui/ exists
        id: has_ui
        run: .github/scripts/ci_local.sh --here ui-present >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b  # v6.1.0
        if: steps.has_ui.outputs.present == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.has_ui.outputs.present == 'true'
        with:
          node-version: "22"
      - if: steps.has_ui.outputs.present == 'true'
        run: .github/scripts/ci_local.sh --here ui
