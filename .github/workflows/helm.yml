name: helm

on:
  pull_request:
    paths: ["deploy/helm/**", ".github/workflows/helm.yml", ".github/scripts/helm_check.py", ".github/scripts/ci_local.sh", "contracts/observability/**", "contracts/topics/**", "deploy/compose/topic-bootstrap/bootstrap_topics.py"]
  push:
    branches: [main, "wave/**"]
    paths: ["deploy/helm/**", ".github/workflows/helm.yml", ".github/scripts/helm_check.py", ".github/scripts/ci_local.sh", "contracts/observability/**", "contracts/topics/**", "deploy/compose/topic-bootstrap/bootstrap_topics.py"]

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: helm lint, template, kubeconform, chart assertions
    runs-on: ${{ vars.TB_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      # Official release tarballs, verified against a pinned checksum before extraction (ci_local.sh).
      - name: install helm and kubeconform (checksum-verified)
        run: .github/scripts/ci_local.sh --here install-helm-tools >> "$GITHUB_PATH"
      - name: helm lint, template, kubeconform, chart assertions and all mutation controls
        run: .github/scripts/ci_local.sh --here helm
