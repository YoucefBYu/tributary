[project]
name = "tributary-receivers"
version = "0.0.0"
description = "Inbound connectors: MLLP, HTTP/FHIR, SFTP, Kafka."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "tributary-sdk",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributary"]

[tool.uv.sources]
tributary-sdk = { workspace = true }
