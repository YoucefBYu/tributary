[project]
name = "tributary-receivers"
version = "0.0.0"
description = "Inbound connectors: MLLP, HTTP/FHIR, SFTP, Kafka."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "tributary-sdk",
    "tributary-runtime",       # config.load_topic_defaults / clients.producer_config: contracts/topics/v0, not a literal here
    "confluent-kafka>=2.6.0",   # Apache-2.0
    "paramiko>=3.4,<5",       # LGPL-2.1, unmodified, human-approved 2026-09-24 for SFTP (licence_check.py LGPL_APPROVED)
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributary"]

[tool.uv.sources]
tributary-sdk = { workspace = true }
tributary-runtime = { workspace = true }
