[project]
name = "tributary-loaders"
version = "0.0.0"
description = "Outbound connectors and idempotent loaders."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "tributary-sdk",
    "tributary-runtime",       # ConsumerLoop, clients/topics/config: contracts/topics/v0, not a literal here
    "confluent-kafka>=2.6.0",   # Apache-2.0
    "asyncpg>=0.30.0",          # Apache-2.0; PostgreSQL loader. Not psycopg (LGPL-3.0, fails licence_check.py)
    "paramiko>=3.4,<5",         # LGPL-2.1, unmodified, human-approved 2026-09-24 for SFTP only (licence_check.py LGPL_APPROVED)
    "botocore>=1.36",           # Apache-2.0; S3 loader (SigV4, credential chain). Not boto3: no transfer manager needed
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributary"]

[tool.uv.sources]
tributary-sdk = { workspace = true }
tributary-runtime = { workspace = true }
