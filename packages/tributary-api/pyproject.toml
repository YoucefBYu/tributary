[project]
name = "tributary-api"
version = "0.0.0"
description = "Control plane: FastAPI app, OIDC resource-server authn (ADR-009), PostgreSQL schema, migrations and repositories."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",   # MIT; the extra pulls greenlet (MIT)
    "asyncpg>=0.30.0",      # Apache-2.0. Not psycopg (LGPL-3.0, denied by licence_check.py pending wave-3.md 7.1)
    "alembic>=1.14",        # MIT
    "fastapi>=0.115",       # MIT (starlette BSD-3-Clause, pydantic MIT)
    "uvicorn>=0.32",        # BSD-3-Clause. No [standard] extra: no uvloop/httptools/watchfiles needed
    "pyjwt[crypto]>=2.10.1",  # MIT; the extra pulls cryptography (Apache-2.0 OR BSD-3-Clause) and cffi (MIT). ADR-009 D8
    "jsonschema>=4.23",     # MIT. Validates channel documents against channel-spec/v0 (the reconciler's job)
    "tributary-runtime",    # reuse of the engine-kafka loader (engine_kafka.py) and the producer profile (clients.py)
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributary"]

[tool.uv.sources]
tributary-runtime = { workspace = true }
