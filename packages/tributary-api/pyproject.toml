[project]
name = "tributary-api"
version = "0.0.0"
description = "Control plane: PostgreSQL schema, migrations and repositories (FastAPI routes follow in W3-4b)."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",   # MIT; the extra pulls greenlet (MIT)
    "asyncpg>=0.30.0",      # Apache-2.0. Not psycopg (LGPL-3.0, denied by licence_check.py pending wave-3.md 7.1)
    "alembic>=1.14",        # MIT
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributary"]
