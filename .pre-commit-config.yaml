# Local hooks only: no remote hook repos to fetch, so versions come from uv.lock and the
# hooks behave the same in CI. Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: gitignore-guard
        name: root .gitignore still protects samples/mirth, .env, secrets/
        entry: uv run python .github/scripts/gitignore_guard.py
        language: system
        pass_filenames: false
        files: ^\.gitignore$
      - id: secret-scan
        name: secret scan (values never printed)
        entry: uv run python .github/scripts/secret_scan.py
        language: system
        pass_filenames: false
      # Advisory (`git push --no-verify` bypasses it): runs the committed HEAD in a clean worktree. Install with
      #   uv run pre-commit install --hook-type pre-push
      - id: ci-local-fast
        name: ci_local.sh fast (contracts, lint, types, fast tests, supply-chain)
        entry: .github/scripts/ci_local.sh fast
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
