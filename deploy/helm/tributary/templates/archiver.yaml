{{- if .Values.archiver.enabled }}
{{- $ch := .Values.archiver.clickhouse }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tb.name" . }}-archiver
  labels:
    {{- include "tb.labels" . | nindent 4 }}
    app.kubernetes.io/component: archiver
spec:
  serviceName: {{ include "tb.name" . }}-headless
  podManagementPolicy: Parallel
  updateStrategy: {type: RollingUpdate}
  replicas: {{ .Values.archiver.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: archiver
  template:
    metadata:
      labels:
        {{- include "tb.labels" . | nindent 8 }}
        app.kubernetes.io/component: archiver
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "tb.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: archiver
          image: {{ include "tb.image" (dict "root" . "pkg" "archiver") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - tributary.archiver
            - --env={{ .Values.env }}
            - --instance-id=$(POD_NAME)
            # ADR-004 A5: the runtime credential is INSERT-only; DDL is the migrate Job's.
            - --skip-ddl
            # W3-27: /livez and /metrics. Loopback by default; bind the pod IP (networkpolicy.yaml limits 9180).
            - --ops-bind=$(POD_IP)
            - --ops-port={{ .Values.receiver.opsPort }}
          env:
            {{- include "tb.downwardEnv" . | nindent 12 }}
            {{- include "tb.archiverEnv" . | nindent 12 }}
            - {name: TB_ARCHIVE_CLICKHOUSE_SECRET_REF, value: {{ $ch.secretRef | quote }}}
            {{- if $ch.caCertSecretRef }}
            - {name: TB_ARCHIVE_CLICKHOUSE_CA_CERT, value: {{ printf "/var/run/secrets/tributary-ca/%s" $ch.caCertSecretKey | quote }}}
            {{- end }}
          ports:
            - {name: ops, containerPort: {{ .Values.receiver.opsPort }}}
          startupProbe:
            httpGet: {path: /livez, port: ops}
            {{- toYaml .Values.receiver.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet: {path: /livez, port: ops}
            {{- toYaml .Values.receiver.probes.liveness | nindent 12 }}
          resources: {{- toYaml .Values.archiver.resources | nindent 12 }}
          securityContext: {{- include "tb.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "tb.kafkaMounts" (dict "root" . "role" "archiver") | nindent 12 }}
            - {name: clickhouse, mountPath: /var/run/secrets/tributary/{{ $ch.secretRef }}, readOnly: true}
            {{- if $ch.caCertSecretRef }}
            - {name: clickhouse-ca, mountPath: /var/run/secrets/tributary-ca, readOnly: true}
            {{- end }}
      volumes:
        {{- include "tb.kafkaVolumes" (dict "root" . "role" "archiver") | nindent 8 }}
        - name: clickhouse
          secret: {secretName: {{ $ch.secretRef }}}
        {{- if $ch.caCertSecretRef }}
        - name: clickhouse-ca
          secret: {secretName: {{ $ch.caCertSecretRef }}}
        {{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tb.name" . }}-archiver
  labels: {{- include "tb.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: archiver
{{- end }}
{{- if .Values.archiver.migrate.enabled }}
---
# Schema migration: pre-install and pre-upgrade, with the MIGRATION credential only (ADR-004 A5).
# --migrate-only needs no Kafka link. The runtime pods never see this secret.
apiVersion: batch/v1
kind: Job
metadata:
  # One name per ClickHouse database (not per release): a second release migrating the same database in this
  # namespace cannot create its Job while the first exists, so the upgrade fails instead of two migrations
  # running at once. Deleted on success or failure (never "before-hook-creation", which would kill a live one).
  name: {{ printf "tb-archiver-migrate-%s" ($ch.database | lower | replace "_" "-") | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "tb.labels" . | nindent 4 }}
    app.kubernetes.io/component: archiver-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed
spec:
  parallelism: 1
  completions: 1
  backoffLimit: {{ .Values.archiver.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.archiver.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "tb.labels" . | nindent 8 }}
        app.kubernetes.io/component: archiver-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{- include "tb.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "tb.image" (dict "root" . "pkg" "archiver") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [tributary.archiver, "--env={{ .Values.env }}", --migrate-only]
          env:
            {{- include "tb.archiverEnv" . | nindent 12 }}
            - {name: TB_ARCHIVE_CLICKHOUSE_MIGRATE_SECRET_REF, value: {{ $ch.migrateSecretRef | quote }}}
            # Decrease guard (ADR-004 R2): read by the migrate step only, never by the archivers.
            - {name: TB_ARCHIVE_ALLOW_TTL_DECREASE, value: {{ ternary "true" "false" .Values.archiver.retention.allowDecrease | quote }}}
            {{- if $ch.caCertSecretRef }}
            - {name: TB_ARCHIVE_CLICKHOUSE_CA_CERT, value: {{ printf "/var/run/secrets/tributary-ca/%s" $ch.caCertSecretKey | quote }}}
            {{- end }}
          resources: {{- toYaml .Values.archiver.resources | nindent 12 }}
          securityContext: {{- include "tb.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: clickhouse-migrate, mountPath: /var/run/secrets/tributary/{{ $ch.migrateSecretRef }}, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if $ch.caCertSecretRef }}
            - {name: clickhouse-ca, mountPath: /var/run/secrets/tributary-ca, readOnly: true}
            {{- end }}
      volumes:
        {{- if $ch.caCertSecretRef }}
        - name: clickhouse-ca
          secret: {secretName: {{ $ch.caCertSecretRef }}}
        {{- end }}
        - name: clickhouse-migrate
          secret: {secretName: {{ $ch.migrateSecretRef }}}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- end }}
{{- end }}
