{{- if .Values.strimzi.enabled }}
{{- $s := .Values.strimzi }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: {{ $s.name }}
  labels:
    strimzi.io/cluster: {{ $s.name }}
    {{- include "tb.labels" . | nindent 4 }}
spec:
  replicas: {{ $s.replicas }}
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ $s.storage.size }}
        {{- if $s.storage.className }}
        class: {{ $s.storage.className }}
        {{- end }}
        deleteClaim: false
  resources: {{- toYaml $s.resources | nindent 4 }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ $s.name }}
  labels: {{- include "tb.labels" . | nindent 4 }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ $s.kafkaVersion | quote }}
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication: {type: scram-sha-512}
    authorization: {type: simple}
    config: {{- toYaml $s.config | nindent 6 }}
    rack: {topologyKey: topology.kubernetes.io/zone}
  entityOperator:
    topicOperator: {}
    userOperator: {}
{{- end }}
{{- if .Values.strimzi.enabled }}
{{- /* One KafkaUser per role. ACLs come from files/acls.json, generated from
       contracts/topics/v0/topic-defaults.json by deploy/helm/gen_acls.py (CI drift check), never written
       here. @ENV@, @CHANNEL@ and @DEST@ are expanded per channel and destination. */}}
{{- $acls := .Files.Get "files/acls.json" | fromJson }}
{{- $ops := dict "READ" "Read" "WRITE" "Write" "DESCRIBE" "Describe" "IDEMPOTENT_WRITE" "IdempotentWrite" "CREATE" "Create" "DELETE" "Delete" "ALTER" "Alter" "CLUSTER_ACTION" "ClusterAction" "ALL" "All" }}
{{- $types := dict "TOPIC" "topic" "GROUP" "group" "CLUSTER" "cluster" }}
{{- $pat := dict "LITERAL" "literal" "PREFIXED" "prefix" }}
{{- $users := dict "receiver" .Values.kafka.roleSecretRefs.receiver "worker" .Values.kafka.roleSecretRefs.worker "loader" .Values.kafka.roleSecretRefs.loader "archiver" .Values.kafka.roleSecretRefs.archiver "lag_reader" .Values.keda.lagReaderUser }}
{{- if .Values.api.enabled }}{{ $_ := set $users "api" .Values.kafka.roleSecretRefs.api }}{{ end }}
{{- range $role, $user := $users }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: {{ $user }}
  labels:
    strimzi.io/cluster: {{ $.Values.strimzi.name }}
    {{- include "tb.labels" $ | nindent 4 }}
    tributary.dev/role: {{ $role | replace "_" "-" }}
spec:
  authentication: {type: scram-sha-512}
  authorization:
    type: simple
    acls:
    {{- range $g := (index $acls.roles $role) }}
    {{- $names := list }}
    {{- $base := $g.name | replace "@ENV@" $.Values.env }}
    {{- if contains "@CHANNEL@" $base }}
      {{- range $ch := $.Values.channels }}
       {{- if or (not $g.syncReplyOnly) $ch.syncReply }}
        {{- $n := $base | replace "@CHANNEL@" $ch.name }}
        {{- if contains "@DEST@" $n }}
          {{- range $d := $ch.destinations }}{{ $names = append $names ($n | replace "@DEST@" $d.name) }}{{ end }}
        {{- else }}{{ $names = append $names $n }}{{ end }}
       {{- end }}
      {{- end }}
    {{- else }}{{ $names = append $names $base }}{{ end }}
    {{- range $name := $names }}
      - resource:
          type: {{ index $types $g.resourceType }}
          {{- if ne $g.resourceType "CLUSTER" }}
          name: {{ $name | quote }}
          patternType: {{ index $pat $g.patternType }}
          {{- end }}
        operations: [{{ index $ops $g.operation }}]
        host: "*"
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- if .Values.strimzi.enabled }}
---
# `_tb.<env>.audit`: a 30 d transport buffer for audit records; the system of record is the ClickHouse
# audit_log table (ADR-004 R7). Values come from topic-defaults.json via files/acls.json (drift-checked).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: tb-{{ .Values.env }}-audit
  labels:
    strimzi.io/cluster: {{ .Values.strimzi.name }}
    {{- include "tb.labels" . | nindent 4 }}
spec:
  topicName: {{ printf "_tb.%s.audit" .Values.env | quote }}
  {{- $t := (.Files.Get "files/acls.json" | fromJson).topics.audit }}
  partitions: {{ $t.partitions }}
  replicas: {{ $t.replicas }}
  config: {{- range $k, $v := $t.config }}
    {{ $k | quote }}: {{ $v | quote }}
  {{- end }}
{{- end }}
